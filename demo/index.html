<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinchblock UI</title>
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%23475569"/><text x="16" y="21.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="%23f8fafc">pb</text></svg>'
    />
    <script>
      // Keep in sync with src/lib/theme-boot.ts (no-flash theme boot).
      ;(function () {
        try {
          var d = document.documentElement
          var theme = localStorage.getItem("pb-ui.theme")
          if (theme && theme !== "ocean") d.classList.add("theme-" + theme)
          var mode = localStorage.getItem("pb-ui.mode") || "system"
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) d.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
